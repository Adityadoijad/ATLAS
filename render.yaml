services:
  - type: web
    name: atlas-api
    runtime: python
    plan: starter
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    preDeployCommand: alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    disk:
      name: atlas-uploads
      mountPath: /var/data/atlas-uploads
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: DATABASE_URL
        fromDatabase:
          name: atlas-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      - key: UPLOAD_DIR
        value: /var/data/atlas-uploads
      - key: FRONTEND_URL
        value: https://atlas-frontend.onrender.com
      - key: ALLOWED_ORIGINS
        value: https://atlas-frontend.onrender.com
      - key: GOOGLE_REDIRECT_URI
        value: https://atlas-api.onrender.com/api/auth/google/callback
  - type: static
    name: atlas-frontend
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://atlas-api.onrender.com

databases:
  - name: atlas-db
    plan: basic-256mb
    databaseName: atlas
    user: atlas_user
